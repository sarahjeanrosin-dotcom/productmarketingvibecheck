[build]
  command = "next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  # Use esbuild so TS/ESM shared code from src/ is bundled into functions
  node_bundler = "esbuild"

[functions."___netlify-server-handler"]
  timeout = 300

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[scheduled_functions]]
path = "/.netlify/functions/scan-reaper-scheduler"
schedule = "*/10 * * * *" # every 10 minutes
